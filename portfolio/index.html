<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: let the page extend into the iOS safe areas
       (status bar, home indicator) instead of stopping at them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- iOS Safari never lets a page draw under its own chrome (status bar /
       URL bar); "edge-to-edge" there is color blending: Safari tints those
       regions from theme-color + the page background. The theme script
       below retints this to match the active theme. -->
  <meta name="theme-color" content="#000000">
  <title>jakedami.co</title>
  <meta name="description" content="building stuff.">
  <!-- Favicon: the # drawn as strokes, not text — a font glyph leaves its own
       side bearings and sits on a baseline, so it renders small and low. These
       four lines are symmetric about (32,32) and span 6–58 of the 64 box. -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%23000000"/><g stroke="%23c8c8c8" stroke-width="7"><path d="M25 6 L19 58"/><path d="M45 6 L39 58"/><path d="M6 23 L58 23"/><path d="M6 41 L58 41"/></g></svg>'>
  <!-- Only the lava theme uses these; three.js is vendored, no CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script>
  // Theme pick — runs before first paint so there's no color flash.
  // ?theme=lava|thermal|ascii wins and persists; saved choice next; default ascii.
  (function () {
    var VALID = { lava: 1, thermal: 1, ascii: 1 };
    var q = new URLSearchParams(location.search).get('theme');
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var t = VALID[q] ? q : VALID[saved] ? saved : 'ascii';
    if (VALID[q]) { try { localStorage.setItem('theme', q); } catch (e) {} }
    document.documentElement.dataset.theme = t;
    var mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.setAttribute('content', t === 'ascii' ? '#000000' : '#f2efe9');
  })();
  </script>
  <style>
    /* Each theme owns its page palette; engines live in themes/*.js. */
    :root[data-theme="lava"],
    :root[data-theme="thermal"] {
      --bg: #f2efe9; --text: #1c1a17; --link: #6f6a60; --link-hover: #1c1a17;
    }
    :root[data-theme="ascii"] {
      --bg: #000; --text: #c8c8c8; --link: #5f5f5f; --link-hover: #b4b4b4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* Explicit html background: Safari samples it when tinting the areas
       beyond the page (status bar, rubber-band overscroll). */
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    canvas.bg-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none; display: block;
    }
    /* iOS: size to the LARGE viewport so the canvas runs behind the
       collapsible URL bar instead of stopping above it. */
    @supports (height: 100lvh) {
      canvas.bg-canvas { height: 100lvh; }
    }
    /* iOS Safari 26 refuses to composite position:fixed content behind its
       floating liquid-glass controls (it gets cut off) — absolute content
       renders edge-to-edge fine. Scoped to iOS via -webkit-touch-callout.
       No scroll appears: body's overflow:hidden propagates to the viewport,
       and with viewport-fit=cover the clip box is the full physical screen. */
    @supports (-webkit-touch-callout: none) {
      canvas.bg-canvas { position: absolute; }
    }
    main {
      position: relative; z-index: 1; height: 100vh;
      display: grid; place-items: center; text-align: center;
    }
    h1 {
      font-size: 1.05rem; font-weight: 400; letter-spacing: .06em;
      margin: 0 0 1.4rem; user-select: none;
    }
    h1::after {
      content: "_"; margin-left: 2px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    nav { display: flex; gap: 1.6rem; justify-content: center; }
    nav a {
      color: var(--link); text-decoration: none; font-size: .8rem;
      letter-spacing: .08em; transition: color .25s ease;
    }
    nav a:hover { color: var(--link-hover); }
  </style>
</head>
<body>
  <main>
    <div id="content">
      <h1>building stuff</h1>
      <nav>
        <a href="https://www.linkedin.com/in/jacobdamico/" target="_blank" rel="noopener">linkedin</a>
        <a href="https://www.instagram.com/jaked.amico/" target="_blank" rel="noopener">instagram</a>
      </nav>
    </div>
  </main>

  <script src="themes/ascii.js"></script>
  <script src="themes/thermal.js"></script>
  <script>
  // Boot the active theme. A theme owns its canvas and context type, so
  // switching is a reload, not a hot swap: visit ?theme=ascii / ?theme=thermal
  // / ?theme=lava, or call setTheme('ascii') from the console. lava is an ES
  // module (three.js) — it needs http(s); on file:// the page falls back to
  // plain paper + text.
  (function () {
    var name = document.documentElement.dataset.theme;
    if (window.__themes[name]) {
      window.__themes[name].start(document.getElementById('content'));
    } else {
      import('./themes/lava.js')
        .then(function (m) { m.start(document.getElementById('content')); })
        .catch(function (e) { console.error('lava theme failed to load:', e); });
    }
    window.setTheme = function (name) {
      try { localStorage.setItem('theme', name); } catch (e) {}
      location.href = location.pathname;
    };
  })();
  </script>
</body>
</html>
