<!doctype html>
<html lang="en" data-theme="riverkeep">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: let the page extend into the iOS safe areas
       (status bar, home indicator) instead of stopping at them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Deliberately NO theme-color meta: on iOS 26 an explicit theme-color
       makes Safari tint its chrome as a SOLID color, replacing the
       translucent blur-of-content that makes pages read edge-to-edge. -->
  <title>jakedami.co</title>
  <meta name="description" content="building stuff.">
  <!-- Link previews (iMessage, Instagram, Slack, X). og.png is a 1200x630
       still of the scene; recapture it when the scene changes a lot.
       Crawlers don't run the page, and need absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jakedami.co/">
  <meta property="og:title" content="jakedami.co">
  <meta property="og:description" content="building stuff.">
  <meta property="og:image" content="https://jakedami.co/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="An ASCII-art night scene: a castle above a river, a campfire, and a signpost that reads building stuff.">
  <!-- og.mp4: an 8 s loop of the solar system (the crane's hold), H.264,
       which iMessage and others play in the preview; og.png stays the still
       for everything that doesn't. Recorded frame by frame from ?intro=1 at
       dpr 3, cropped 1.4x round the sun, last second faded into the first. -->
  <meta property="og:video" content="https://jakedami.co/og.mp4">
  <meta property="og:video:secure_url" content="https://jakedami.co/og.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1200">
  <meta property="og:video:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Favicon: a bold lowercase j in the signpost's cream, on the night sky's
       navy. Text glyphs sit on a baseline and carry side bearings, so the y is
       tuned by hand: the j's visual center (dot to descender tail) lands near
       the middle of the box. Renders in whatever the monospace stack resolves
       to per platform, same as the page. -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23080f18"/><text x="32" y="46" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-weight="700" font-size="52" fill="%23e9db98">j</text></svg>'>
  <!-- One theme ships: riverkeep. The other themes (ascii, thermal, lava,
       landscape, landscape3d) and the ?theme= switcher live on the
       theme-lab branch. -->
  <style>
    :root[data-theme="riverkeep"] {
      --bg: #080f18; --text: #e3e9de; --link: #9bada4; --link-hover: #f1ecd9;
    }
    * { box-sizing: border-box; }
    /* No double-tap-to-zoom (it visibly shifts the locked page on iOS);
       plain taps and clicks are unaffected. Set on the root as well as the
       body so no part of the page is left out; iOS also needs the touchend
       guard in the theme (see start()). */
    html, body { height: 100%; touch-action: manipulation; }
    /* Explicit html background: Safari samples it when tinting the areas
       beyond the page (status bar, rubber-band overscroll). */
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    canvas.bg-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none; display: block;
    }
    /* iOS: size to the LARGE viewport so the canvas runs behind the
       collapsible URL bar instead of stopping above it. */
    @supports (height: 100lvh) {
      canvas.bg-canvas { height: 100lvh; }
    }
    /* iOS Safari 26, researched behavior:
       - fixed content is hard-clipped at the floating controls → absolute
       - viewport-fit=cover reaches the BOTTOM safe area but never the top
         status bar; the only pixels Safari composites behind the status bar
         are scrolled-past ones.
       So the page gets an invisible scroll runway (--runway): the canvas is
       oversized, the scroll is parked past the runway on load (and snapped
       back by the theme if disturbed), and Safari blurs real field pixels
       behind both the status bar and the bottom controls — the same way any
       scrolled page shows through them. Scoped to iOS WebKit via
       -webkit-touch-callout; desktop/Android keep the static layout. */
    @supports (-webkit-touch-callout: none) {
      :root { --runway: 80px; }
      html { overflow-y: auto; overscroll-behavior-y: none; }
      body { overflow: visible; min-height: calc(100lvh + var(--runway)); }
      canvas.bg-canvas { position: absolute; }
    }
    /* The signpost is drawn by the scene. Its heading is kept for screen
       readers and search; each link is an invisible hit area the theme lays
       over its board, so clicks, taps and keyboard focus still work. */
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .board-link {
      position: absolute; z-index: 1; color: transparent; font-size: 0;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .board-link:focus-visible { outline: 1px dashed #e9db98; outline-offset: 2px; }
  </style>
</head>
<body>
  <main id="sign">
    <h1 class="sr">building stuff</h1>
    <nav>
      <a class="board-link" data-board="1" href="https://www.linkedin.com/in/jacobdamico/" target="_blank" rel="noopener">linkedin</a>
      <a class="board-link" data-board="2" href="https://github.com/jakedamico" target="_blank" rel="noopener">github</a>
      <a class="board-link" data-board="3" href="https://www.instagram.com/jaked.amico/" target="_blank" rel="noopener">instagram</a>
    </nav>
  </main>

  <!-- Bump ?v= whenever any of the scripts changes. They depend on each
       other, and Safari would otherwise pair a fresh one with a stale cached
       copy. glyphs-gl.js is the WebGL glyph engine; riverkeep.js draws
       through a 2D context when it is missing. -->
  <script src="themes/glyphs-gl.js?v=2026-10-28i"></script>
  <script src="themes/folk.js?v=2026-10-28i"></script>
  <script src="themes/riverkeep.js?v=2026-10-28i"></script>
  <script>window.__themes.riverkeep.start(document.getElementById('sign'));</script>
</body>
</html>
