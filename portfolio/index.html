<!doctype html>
<html lang="en" data-theme="riverkeep">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: let the page extend into the iOS safe areas
       (status bar, home indicator) instead of stopping at them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Deliberately NO theme-color meta: on iOS 26 an explicit theme-color
       makes Safari tint its chrome as a SOLID color, replacing the
       translucent blur-of-content that makes pages read edge-to-edge. -->
  <title>jakedami.co</title>
  <meta name="description" content="building stuff.">
  <!-- Favicon: a lowercase j in the site's monospace stack. Text glyphs sit on
       a baseline and carry side bearings, so the y is tuned by hand: the j's
       visual center (dot to descender tail) lands near the middle of the box.
       Renders in whatever the stack resolves to per platform, same as the page. -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%23000000"/><text x="32" y="45" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="52" fill="%23f2f2f2">j</text></svg>'>
  <!-- One theme ships: riverkeep. The other themes (ascii, thermal, lava,
       landscape, landscape3d) and the ?theme= switcher live on the
       theme-lab branch. -->
  <style>
    :root[data-theme="riverkeep"] {
      --bg: #080f18; --text: #e3e9de; --link: #9bada4; --link-hover: #f1ecd9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* Explicit html background: Safari samples it when tinting the areas
       beyond the page (status bar, rubber-band overscroll). */
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      /* No double-tap-to-zoom (it visibly shifts the locked page on iOS);
         plain taps and clicks are unaffected. */
      touch-action: manipulation;
    }
    canvas.bg-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none; display: block;
    }
    /* iOS: size to the LARGE viewport so the canvas runs behind the
       collapsible URL bar instead of stopping above it. */
    @supports (height: 100lvh) {
      canvas.bg-canvas { height: 100lvh; }
    }
    /* iOS Safari 26, researched behavior:
       - fixed content is hard-clipped at the floating controls → absolute
       - viewport-fit=cover reaches the BOTTOM safe area but never the top
         status bar; the only pixels Safari composites behind the status bar
         are scrolled-past ones.
       So the page gets an invisible scroll runway (--runway): the canvas is
       oversized, the scroll is parked past the runway on load (and snapped
       back by the theme if disturbed), and Safari blurs real field pixels
       behind both the status bar and the bottom controls — the same way any
       scrolled page shows through them. Scoped to iOS WebKit via
       -webkit-touch-callout; desktop/Android keep the static layout. */
    @supports (-webkit-touch-callout: none) {
      :root { --runway: 80px; }
      html { overflow-y: auto; overscroll-behavior-y: none; }
      body { overflow: visible; min-height: calc(100lvh + var(--runway)); }
      canvas.bg-canvas { position: absolute; }
      main { height: 100svh; margin-top: var(--runway); }
    }
    main {
      position: relative; z-index: 1; height: 100vh;
      display: grid; place-items: center; text-align: center;
    }
    h1 {
      display: inline-block; position: relative; text-align: left;
      font-size: 1.05rem; font-weight: 400; letter-spacing: .06em;
      margin: 0 0 1.4rem; user-select: none;
    }
    /* Entry typing: the invisible ghost holds the finished layout so the box
       — and the field's cutout zone measured from it — never shifts; #typed
       sits on top and grows a character at a time, its ::after cursor riding
       the last character. The ghost deliberately has NO cursor: the box is
       exactly the words, so the words center and the cursor overhangs. */
    h1 .ghost { visibility: hidden; }
    #typed { position: absolute; left: 0; top: 0; white-space: pre; }
    #typed::after {
      content: "_"; margin-left: 2px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    nav { display: flex; gap: 1.6rem; justify-content: center; }
    nav a {
      color: var(--link); text-decoration: none; font-size: .8rem;
      letter-spacing: .08em; transition: color .25s ease;
    }
    nav a:hover { color: var(--link-hover); }
  </style>
</head>
<body>
  <main>
    <div id="content">
      <h1 aria-label="building stuff"><span class="ghost" aria-hidden="true">building stuff</span><span id="typed" aria-hidden="true"></span></h1>
      <nav>
        <a href="https://www.linkedin.com/in/jacobdamico/" target="_blank" rel="noopener">linkedin</a>
        <a href="https://www.instagram.com/jaked.amico/" target="_blank" rel="noopener">instagram</a>
      </nav>
    </div>
  </main>

  <script src="themes/riverkeep.js"></script>
  <script>
  // Type the h1 once per load, then leave it (the cursor keeps blinking).
  // Reduced-motion users get the finished text immediately.
  (function () {
    var typed = document.getElementById('typed');
    var text = 'building stuff';
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      typed.textContent = text;
      return;
    }
    var i = 0;
    setTimeout(function tick() {
      typed.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, 55 + Math.random() * 50);
    }, 350);
  })();

  window.__themes.riverkeep.start(document.getElementById('content'));
  </script>
</body>
</html>
